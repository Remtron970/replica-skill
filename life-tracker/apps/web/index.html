<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Life Tracker</title>
    <meta name="description" content="One app. Everything happening in my life." />
    <meta name="theme-color" content="#FF7A1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Life Tracker" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var t = "system";
        try { t = JSON.parse(localStorage.getItem("lt.prefs") || "{}").theme || "system"; } catch (e) {}
        var host = document.documentElement.getAttribute("data-theme");
        var sys = host === "dark" || host === "light" ? host === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        var dark = t === "dark" || (t === "system" && sys);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
